name: Terraform Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - '**/*.tf'
      - '**/*.tftest.hcl'
      - '.github/workflows/terraform-checks.yaml'

permissions:
  contents: read

jobs:
  validate-and-format:
    name: Validate and Format Terraform Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        id: terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.2
      
      - name: Format Terraform
        id: format
        run: terraform fmt -check -recursive

      - name: Initialize and validate Terraform configurations
        run: |
          for directory in . modules/nsg modules/firewall tests/fixtures/root tests/fixtures/nsg tests/fixtures/firewall examples/example-nsg examples/example-firewall; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate
          done

      - name: Test runner isolation policies
        run: |
          for directory in modules/nsg modules/firewall; do
            terraform -chdir="$directory" test
          done
